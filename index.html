<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Santa 2025</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #b30000, #ffcc70);
      background-attachment: fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      margin: auto;
      border-radius: 15px;
      padding: 30px;
      max-width: 90vw;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    select, button {
      margin: 15px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #fff;
      color: #b30000;
      font-weight: bold;
    }
    button:hover {
      background: #ffe6e6;
      cursor: pointer;
    }
    .reveal-text {
      margin-top: 20px;
      font-size: 24px;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { color: #fff; }
      50% { color: #ffe066; }
      100% { color: #fff; }
    }
    footer {
      text-align: center;
      padding: 10px;
      color: #fff9;
      position: absolute;
      bottom: 10px;
      width: 100%;
    }
    #countdown {
      font-size: 18px;
      margin-top: 15px;
      color: #fffa;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: #fff;
      font-size: 1em;
      user-select: none;
      z-index: 9999;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎄 Secret Santa 2025 🎄</h1>
    <p>Select your **codename** to reveal who you’re gifting to!</p>
    <select id="codeSelect">
      <option value="">-- Choose Your Codename --</option>
      <option value="Icy Bell">Icy Bell</option>
      <option value="Frosty Comet">Frosty Comet</option>
      <option value="Sugar Pine">Sugar Pine</option>
      <option value="Winter Whisper">Winter Whisper</option>
      <option value="Snow Echo">Snow Echo</option>
      <option value="Midnight Ember">Midnight Ember</option>
      <option value="Northern Glow">Northern Glow</option>
      <option value="Twinkle Fern">Twinkle Fern</option>
      <option value="Silent Star">Silent Star</option>
      <option value="Blitzen Flare">Blitzen Flare</option>
      <option value="Cinnamon Frost">Cinnamon Frost</option>
      <option value="Silver Fir">Silver Fir</option>
      <option value="Star Drift">Star Drift</option>
      <option value="Glimmer Birch">Glimmer Birch</option>
      <option value="Crystal Owl">Crystal Owl</option>
    </select>
    <button onclick="revealRealName()">Reveal</button>
    <div id="result" class="reveal-text"></div>
    <div id="countdown"></div>
  </div>

  <footer>Crafted with ✨ by KidKed, 2025</footer>
  <audio id="chime" preload="auto">
    <source src="https://github.com/anars/blank-audio/raw/master/1-second-of-silence.mp3" type="audio/mpeg">
  </audio>

  <script>
    const reversePairings = {
      "Icy Bell": "Jemima",
      "Frosty Comet": "Jathniel",
      "Sugar Pine": "Malaika",
      "Winter Whisper": "Valerie",
      "Snow Echo": "Derrick",
      "Midnight Ember": "Sylvia",
      "Northern Glow": "Dianah",
      "Twinkle Fern": "Daniel",
      "Silent Star": "Ritah",
      "Blitzen Flare": "Racheal",
      "Cinnamon Frost": "Rebecca",
      "Silver Fir": "Vally",
      "Star Drift": "Alex",
      "Glimmer Birch": "Mom",
      "Crystal Owl": "Dad"
    };

    function revealRealName() {
      const codename = document.getElementById("codeSelect").value;
      const result = document.getElementById("result");
      const chime = document.getElementById("chime");

      if (!codename) return result.innerHTML = "";

      const already = localStorage.getItem("reveal_" + codename);
      const realName = reversePairings[codename];

      if (already) {
        result.innerHTML = `🎁 You are gifting to: <strong>${already}</strong>`;
      } else {
        result.innerHTML = `🎁 You are gifting to: <strong>${realName}</strong>`;
        chime.play();
        localStorage.setItem("reveal_" + codename, realName);
      }
    }

    // Countdown
    function updateCountdown() {
      const now = new Date();
      const xmas = new Date("December 25, 2025 00:00:00");
      const diff = xmas - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "🎁 Merry Christmas!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s until Christmas!`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Snowfall
    function createSnowflake() {
      const flake = document.createElement("div");
      flake.classList.add("snowflake");
      flake.textContent = "❄️";
      flake.style.left = Math.random() * 100 + "vw";
      flake.style.animationDuration = (Math.random() * 3 + 2) + "s";
      flake.style.fontSize = (Math.random() * 10 + 10) + "px";
      document.body.appendChild(flake);
      setTimeout(() => flake.remove(), 5000);
    }
    setInterval(createSnowflake, 300);
  </script>

</body>
</html>
