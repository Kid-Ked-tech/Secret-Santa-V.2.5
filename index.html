<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Santa 2025</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #d7373f, #740404);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 450px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    select, button {
      margin: 15px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    .reveal-text {
      margin-top: 20px;
      font-size: 24px;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { color: #ffebcd; }
      50% { color: #fff700; }
      100% { color: #ffebcd; }
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #ccc;
    }

    #countdown {
      margin-top: 10px;
      font-size: 16px;
      color: #ffffffb3;
    }

    /* Snowflake styling */
    .snowflake {
      position: fixed;
      top: -10px;
      font-size: 1em;
      color: #fff;
      user-select: none;
      animation: fall linear infinite;
      z-index: 999;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎄 Secret Santa 2025 🎁</h1>
    <p>Select your <strong>codename</strong> to reveal who you're gifting to:</p>

    <select id="codenameSelect">
      <option value="">-- Choose Your Codename --</option>
      <option value="Crystal Owl">Crystal Owl</option>
      <option value="Icy Bell">Icy Bell</option>
      <option value="Glimmer Birch">Glimmer Birch</option>
      <option value="Winter Whisper">Winter Whisper</option>
      <option value="Midnight Ember">Midnight Ember</option>
      <option value="Snow Echo">Snow Echo</option>
      <option value="Silent Star">Silent Star</option>
      <option value="Sugar Pine">Sugar Pine</option>
      <option value="Frosty Comet">Frosty Comet</option>
      <option value="Northern Glow">Northern Glow</option>
      <option value="Silver Fir">Silver Fir</option>
      <option value="Star Drift">Star Drift</option>
      <option value="Twinkle Fern">Twinkle Fern</option>
      <option value="Blitzen Flare">Blitzen Flare</option>
      <option value="Cinnamon Frost">Cinnamon Frost</option>
    </select>

    <button onclick="revealGiftee()">Reveal</button>
    <div id="result" class="reveal-text"></div>
    <div id="countdown"></div>
  </div>

  <footer>✨ Developed with joy by KidKed, 2025</footer>

  <!-- Optional chime -->
  <audio id="chime" preload="auto">
    <source src="https://github.com/anars/blank-audio/raw/master/1-second-of-silence.mp3" type="audio/mpeg">
  </audio>

  <script>
    const giftees = {
      "Crystal Owl": "Ritah",
      "Icy Bell": "Racheal",
      "Glimmer Birch": "Mom",
      "Winter Whisper": "Daniel",
      "Midnight Ember": "Jathniel",
      "Snow Echo": "Rebecca",
      "Silent Star": "Valerie",
      "Sugar Pine": "Alex",
      "Frosty Comet": "Vally",
      "Northern Glow": "Dianah",
      "Silver Fir": "Derrick",
      "Star Drift": "Valerie",
      "Twinkle Fern": "Malaika",
      "Blitzen Flare": "Dad",
      "Cinnamon Frost": "Sylvia"
    };

    function revealGiftee() {
      const code = document.getElementById("codenameSelect").value;
      const result = document.getElementById("result");
      const chime = document.getElementById("chime");

      if (!code) {
        result.innerHTML = "";
        return;
      }

      const stored = localStorage.getItem("seen_" + code);
      if (stored) {
        result.innerHTML = `🎁 You've already revealed: <strong>${stored}</strong>`;
      } else {
        const name = giftees[code];
        result.innerHTML = `🎁 You are Secret Santa to: <strong>${name}</strong>`;
        chime.play();
        localStorage.setItem("seen_" + code, name);
      }
    }

    // Countdown
    function updateCountdown() {
      const now = new Date();
      const target = new Date("December 25, 2025 00:00:00");
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "🎄 Merry Christmas!";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerHTML = 
        `⏳ ${d}d ${h}h ${m}m ${s}s until Christmas!`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Snowfall
    function createSnowflake() {
      const snow = document.createElement("div");
      snow.classList.add("snowflake");
      snow.textContent = "❄️";
      snow.style.left = Math.random() * 100 + "vw";
      snow.style.fontSize = (Math.random() * 10 + 10) + "px";
      snow.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(snow);
      setTimeout(() => snow.remove(), 5000);
    }

    setInterval(createSnowflake, 300);
  </script>
</body>
</html>
