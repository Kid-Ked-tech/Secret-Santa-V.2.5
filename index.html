<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Santa 2025</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #d7373f, #740404);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }
    .container {
      background: rgba(0,0,0,0.6);
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 5px; }
    .dress-code {
      font-size: 1rem;
      margin: 10px 0 20px;
      color: #ffe6e6;
      line-height: 1.6;
    }
    input, button {
      margin: 15px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    input { width: 70%; text-align: center; }
    button {
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .reveal-text {
      margin-top: 20px;
      font-size: 24px;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { color: #ffebcd; }
      50% { color: #fff700; }
      100% { color: #ffebcd; }
    }
    footer { margin-top: 30px; font-size: 14px; color: #ccc; }
    #countdown { margin-top: 10px; font-size: 16px; color: #ffffffb3; }
    .snowflake {
      position: fixed; top: -10px; font-size: 1em; color: #fff;
      user-select: none; animation: fall linear infinite; z-index: 999;
    }
    @keyframes fall { to { transform: translateY(100vh); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎄 Secret Santa 2025 🎁</h1>
    <div class="dress-code">
      <strong>By DerrickEmma</strong><br><br>
      <strong>Dress Code:</strong><br>
      Black as the main lead,<br>
      with <span style="color:#ff6666;">Red</span>, 
      <span style="color:#ffe066;">Yellow</span>, or 
      <span style="color:#ffb6c1;">Peach</span>.
    </div>

    <p>Enter your codename (lowercase, no spaces):</p>
    <input type="text" id="codeInput" placeholder="e.g. christmaseve">
    <button onclick="revealGiftee()">Reveal</button>
    <div id="result" class="reveal-text"></div>
    <div id="countdown"></div>
  </div>

  <footer>✨ Made with love by DerrickEmma</footer>

  <script>
    // Codename-to-giftee mapping
    const giftees = {
      "silentstar": "Sylvia",         
      "midnightember": "Vally",       
      "twinklefern": "Alex",          
      "stardrift": "Daniel",          
      "silverfir": "Ritah",           
      "cinnamonfrost": "Racheal",     
      "northernglow": "Mom",          
      "winterwhisper": "Malaika",     
      "crystalowl": "Rebecca",        
      "icybell": "Jathniel",          
      "snowecho": "Jemimah",          
      "frostycomet": "Dad",           
      "sugarpine": "Valerie",         
      "glimmerbirch": "Dianah",       
      "blitzenflare": "Derrick"       
    };

    function revealGiftee() {
      const input = document.getElementById("codeInput").value.toLowerCase().replace(/\s+/g, '');
      const result = document.getElementById("result");

      if (giftees[input]) {
        const name = giftees[input];
        result.innerHTML = `🎁 You are Secret Santa to: <strong>${name}</strong>`;
      } else {
        result.innerHTML = "⛔ Please enter your codename in small letters with no space.";
      }
    }

    // Countdown
    function updateCountdown() {
      const now = new Date();
      const target = new Date("December 25, 2025 00:00:00");
      const diff = target - now;
      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "🎄 Merry Christmas!";
        return;
      }
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);
      document.getElementById("countdown").innerHTML = 
        `⏳ ${d}d ${h}h ${m}m ${s}s until Christmas!`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Snowfall
    function createSnowflake() {
      const snow = document.createElement("div");
      snow.classList.add("snowflake");
      snow.textContent = "❄️";
      snow.style.left = Math.random() * 100 + "vw";
      snow.style.fontSize = (Math.random() * 10 + 10) + "px";
      snow.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(snow);
      setTimeout(() => snow.remove(), 5000);
    }
    setInterval(createSnowflake, 300);
  </script>
</body>
</html>
